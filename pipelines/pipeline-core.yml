                  terraform plan --var-file "$(System.DefaultWorkingDirectory)/core/vars/prd.tfvars"                  

        - job: Approval
          displayName: "Manual Approval"
          dependsOn: Plan
          pool: server
          steps:
            - task: ManualValidation@0
              timeoutInMinutes: 10
              inputs:
                instructions: "Approve to proceed with Terraform Apply"

        - job: Apply
          displayName: "Terraform Apply"
          pool: ${{ parameters.agentPool }}
          dependsOn: Approval
          steps:
            - task: TerraformInstaller@1
              inputs:
